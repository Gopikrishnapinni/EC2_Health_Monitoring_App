[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ec2-health-monitor"
version = "0.1.0"
description = "Monitor AWS EC2 instance and system health checks from the command line."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ec2-health = "ec2_health_monitor.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

