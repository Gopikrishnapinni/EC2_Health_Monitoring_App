apiVersion: batch/v1
kind: CronJob
metadata:
  name: ec2-health-monitor
  namespace: ec2-monitor
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ec2-health-monitor
        spec:
          serviceAccountName: ec2-health-monitor
          restartPolicy: Never
          containers:
            - name: monitor
              image: ec2-health-monitor:latest
              imagePullPolicy: IfNotPresent
              args:
                - --json
                - --cpu-threshold
                - "$(CPU_THRESHOLD)"
                - --lookback-minutes
                - "$(LOOKBACK_MINUTES)"
              envFrom:
                - configMapRef:
                    name: ec2-health-monitor-config
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault

